[package]
name = "tabula"
version = "0.1.0"
edition = "2021"
description = "Proof of non-knowledge — certified absence of a datum over an append-only hash-chained history"
license = "MIT"

[dependencies]
ed25519-dalek = { version = "2", features = ["rand_core"] }
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = "0.8"

[dev-dependencies]
tempfile = "3"
